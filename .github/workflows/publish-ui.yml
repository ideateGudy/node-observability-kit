name: Publish Stacklenzz UI Dashboard

on:
  push:
    branches:
      - main
    paths:
      - "observability-ui/**"
      - ".github/workflows/publish-ui.yml"
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
          - skip

permissions:
  contents: write
  id-token: write

jobs:
  publish-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: observability-ui

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Ensure latest npm
        run: npm install -g npm@latest

      - name: Install Dependencies
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund
        working-directory: .

      - name: Run Tests
        run: npm run test:ui
        working-directory: .

      - name: Bump Version
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.version_bump != 'skip' }}
        env:
          BUMP_TYPE: ${{ inputs.version_bump }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          npm version "$BUMP_TYPE" -m "chore(release): @stacklenzz/ui %s"

      - name: Build Package
        run: npm run build

      - name: Check & Publish to NPM
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          EXISTS=$(npm view @stacklenzz/ui@$CURRENT_VERSION version --silent || echo "not_found")
          if [ "$EXISTS" = "not_found" ]; then
            npm publish --access public --provenance
          else
            echo "Version $CURRENT_VERSION already published on NPM, skipping publish step."
          fi

      - name: Push Git Release Tag
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.version_bump != 'skip' }}
        run: git push --follow-tags
        working-directory: observability-ui
