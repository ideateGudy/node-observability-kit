name: Publish Stacklenzz UI Dashboard

on:
  push:
    branches:
      - main
    paths:
      - "observability-ui/**"
      - ".github/workflows/publish-ui.yml"
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
          - skip

permissions:
  contents: write
  id-token: write

jobs:
  publish-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: observability-ui

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Ensure latest npm (supports OIDC Trusted Publishing)
        run: npm install -g npm@latest

      - name: Install Dependencies
        run: npm ci
        working-directory: .

      - name: Run Tests
        run: npm run test

      - name: Bump Version
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.version_bump != 'skip' }}
        env:
          BUMP_TYPE: ${{ inputs.version_bump }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          npm version "$BUMP_TYPE" -m "chore(release): @stacklenzz/ui %s"

      - name: Build Package
        run: npm run build

      - name: Check & Publish to NPM via OIDC
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          EXISTS=$(npm view @stacklenzz/ui@$CURRENT_VERSION version --silent || echo "not_found")
          if [ "$EXISTS" = "not_found" ]; then
            # If NODE_AUTH_TOKEN secret is provided, npm uses it; otherwise OIDC tokenless trusted publisher will authenticate automatically
            if [ -n "$NPM_TOKEN" ]; then
              echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
            fi
            npm publish --access public --provenance
          else
            echo "Version $CURRENT_VERSION already published on NPM, skipping publish step."
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push Git Release Tag
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.version_bump != 'skip' }}
        run: git push --follow-tags
        working-directory: observability-ui
